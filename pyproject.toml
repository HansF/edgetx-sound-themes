[project]
name = "edgetx-sound-themes"
version = "0.1.0"
description = "MIDI-composed sound theme packs for EdgeTX radios"
requires-python = ">=3.11"
dependencies = ["numpy>=2", "scipy>=1.13", "mido>=1.3"]

[dependency-groups]
dev = [
    "pytest>=8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
